name: Self-host image
on:
  push:
    branches: [codex/self-host]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: self-host-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ZERO_IMAGE: zero-selfhost:${{ github.sha }}
      ZERO_ORIGIN: https://zero.example.test
      POSTGRES_PASSWORD: local-ci-postgres
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          docker build --label org.opencontainers.image.source="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --file docker/self-host/Dockerfile --tag "$ZERO_IMAGE" .
      - name: Check Compose startup
        run: |
          docker compose -f docker-compose.self-host.yaml up -d
          trap 'docker compose -f docker-compose.self-host.yaml logs --tail=80; docker compose -f docker-compose.self-host.yaml down -v' EXIT
          curl --fail --silent --show-error --retry 25 --retry-all-errors --retry-delay 3 \
            --max-time 8 http://127.0.0.1:8300/health
          curl --fail --silent --show-error http://127.0.0.1:8300/login | grep -q '/assets/'
      - name: Export image
        run: docker image save "$ZERO_IMAGE" | gzip -1 > zero-selfhost.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: zero-selfhost-image
          path: zero-selfhost.tar.gz
          compression-level: 0
          retention-days: 7
